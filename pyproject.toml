[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shannon-forensics"
version = "1.0.0"
description = "Static entropy profiling and statistical RGB steganalysis"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
shannon-forensics = "main:entrypoint"

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "analyzers", "visualizers", "reporters", "scripts"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
